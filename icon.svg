<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: linear-gradient(145deg, #3b82f6, #1d4ed8) -->
    <linearGradient id="bgGradient" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Top Inset Highlight: inset 0 1px 1px rgba(255,255,255,0.2) -->
    <linearGradient id="insetShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="12%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Inner Icon Shadow: drop-shadow-md -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.07" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.06" />
    </filter>

    <!-- Outer Box Shadow: 0 4px 12px rgba(29, 78, 216, 0.3) -->
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#1d4ed8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- The .logo-container block -->
  <!-- Scaled up from 38px to a 420x420 square with proportional 132px border-radius -->
  <rect x="46" y="46" width="420" height="420" rx="132" fill="url(#bgGradient)" filter="url(#boxShadow)" />
  
  <!-- Inset Border Overlay -->
  <rect x="48" y="48" width="416" height="416" rx="130" fill="none" stroke="url(#insetShadow)" stroke-width="4" />

  <!-- The Brain Icon (Remix/Lucide Line Style) -->
  <!-- Scaled from text-2xl (24px) to 265px to match the original container-to-icon ratio -->
  <g transform="translate(123.5, 123.5) scale(11.04)" fill="none" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" filter="url(#iconShadow)">
    <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z" />
    <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z" />
  </g>
</svg>
